[project]
name = "xoa"
authors = [
    {name = "Shom", email = "stephane.raynaud@shom.fr"},
]
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "xarray-based ocean analysis library"
dynamic = ["version"]
readme = "README.rst"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Atmospheric Science"
]
requires-python = ">=3.10"
dependencies = [
    "platformdirs",
    "cmocean",
    "configobj",
    "dask",
    "gsw",
    "netCDF4",
    "numba",
    "pooch",
    "scipy",
    "xarray>=2024.6"
]

[project.optional-dependencies]
plot = ["cartopy"]
docs = [
  "cartopy",
  "cmocean",
  "ipython",
  "jupyter_client",
  "matplotlib",
  "owslib",
  "sphinx<9",
  "sphinx_autosummary_accessors",
  "sphinx-argparse",
  "sphinx-book-theme",
  "sphinxcontrib-programoutput",
  "sphinx-gallery"
]

[project.urls]
homepage = "https://xoa.readthedocs.io/"
issue-tracker = "https://github.com/shom-fr/xoa/issues"
source-code = "https://github.com/shom-fr/xoa"

[project.entry-points.console_scripts]
xoa = "xoa.cli:main"

[build-system]
requires = ["setuptools>=64", "wheel", "setuptools-scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["xoa", "xoa.*"]

[tool.setuptools.package-data]
"xoa" = ["*.txt", "*.ini"]
"xoa.tide" = ["*.cfg", "*.ini"]
"xoa.meta.configs" = ["*.cfg"]


[tool.setuptools_scm]
fallback_version = "0.0.0"
write_to = "xoa/_version.py"
tag_regex= "^(?P<prefix>v)?(?P<version>[^\\+]+)(?P<suffix>.*)?$"


[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
  "xoa/_version.py",  # generated by setuptools-scm
  "doc",
  "try",
  "external",
]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
]
ignore = [
  "E203",  # whitespace before ':'
  "E402",  # module level import not at top of file
  "E501",  # line too long, handled by the formatter
  "E731",  # do not assign a lambda expression, use a def
  "E741",  # ambiguous variable name, used in numba kernels
  "E722",  # bare except
  "UP031",  # percent format
]

[tool.ruff.format]
# Equivalent to black's skip-string-normalization
quote-style = "preserve"
