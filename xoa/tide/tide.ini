# Spec file for tidal constituent database.
# Each section defines one constituent; unknown section names are accepted (__many__).

[__many__]
# Doodson number string (e.g. '255.555')
doodson = string(default='')

# Tidal species: 0=long-period 1=diurnal 2=semidiurnal etc.
species = integer(default=0, min=0)

# Nodal satellite phasors: semicolon-separated groups of 5 floats
# Format: r dN dp dp1 phi0_deg ; r dN dp dp1 phi0_deg ; ...
satellites = satellites(default='')

# Compound-constituent components: one subsection per source constituent.
# Omit entirely for non-compound constituents.
[[compound_of]]
[[[__many__]]]
multiplier = integer(default=1, min=1)
