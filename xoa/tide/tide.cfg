# Tidal constituent database.
# Copy to the xoa user config directory as tide.cfg to override or extend the defaults.
#
# Each top-level section is a constituent name.
# phase      : constant phase in degrees added to the Doodson argument (diurnal constituents)
# satellites : semicolon-separated tuples of 5 floats (r dN dp dp1 phi0_deg)
#              where N is the longitude of the lunar node, so that
#              f·exp(iu) = 1 + Σ r·exp(i(dN·N + dp·p + dp1·p1 + phi0))
# compound_of: nested subsections, one per source constituent, each with a multiplier key,
#              which may be negative: f = Π f_i^|m_i| and u = Σ m_i·u_i.
#
# The satellites are those of Foreman (1977), as in t_tide and utide, without the
# latitude-dependent ones, except for Mm and Mf, which follow the series of Schureman (1958).

